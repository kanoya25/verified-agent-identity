name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'Your agent name'
        required: true
        default: 'kanoya25'
      agent_description:
        description: 'Your agent description'
        required: true
        default: 'kanoya25 AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install ClawHub skill
        run: npx --yes clawhub@latest install verified-agent-identity

      # 🔥 SUPER FIX (ethers + signingkey + path)
      - name: Install dependencies
        run: |
          cd scripts

          rm -rf node_modules package-lock.json

          npm install

          npm uninstall ethers || true

          npm install ethers@5.7.2
          npm install @ethersproject/signing-key@5.7.0

      # 🔥 jalankan dari folder yang benar
      - name: Create Ethereum Identity
        run: |
          cd scripts
          node createNewEthereumIdentity.js

      # 🔥 JSON aman
      - name: Link Human to Agent
        run: |
          node scripts/manualLinkHumanToAgent.js --challenge "{\"name\":\"kanoya25\",\"description\":\"kanoya25 AI Agent\"}"
