name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'Your agent name'
        required: true
        default: 'kanoya25'
      agent_description:
        description: 'Your agent description'
        required: true
        default: 'kanoya25 AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # ✅ WAJIB Node 20 full (jangan split 18 lagi)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # fix npm clean install biar ESM tidak rusak
      - name: Clean install dependencies
        run: |
          cd scripts
          rm -rf node_modules package-lock.json
          npm install

      # install clawhub
      - name: Install ClawHub skill
        run: npx clawhub@latest install verified-agent-identity

      # 🔥 FIX ESM COMPATIBILITY (ini kunci)
      - name: Force ESM compatible deps
        run: |
          cd scripts
          npm install @noble/hashes@latest
          npm install @iden3/js-crypto@latest
          npm install @0xpolygonid/js-sdk@latest

      - name: Create Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js

      - name: Link Human to Agent
        run: |
          node scripts/manualLinkHumanToAgent.js --challenge '{"name": "kanoya25", "description": "kanoya25 AI Agent"}'
