name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'Your agent name'
        required: true
        default: 'kanoya25'
      agent_description:
        description: 'Your agent description'
        required: true
        default: 'kanoya25 AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # ✅ STEP 1: pakai Node 20 untuk ClawHub
      - name: Setup Node.js (for ClawHub)
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install ClawHub skill
        run: npx clawhub@latest install verified-agent-identity

      # ✅ STEP 2: turunin ke Node 18 buat script
      - name: Switch to Node 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # ✅ FIX ethers
      - name: Fix ethers version
        run: |
          cd scripts
          npm uninstall ethers
          npm install ethers@5

      - name: Install dependencies
        run: |
          cd scripts
          npm install

      - name: Create Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js

      - name: Link Human to Agent
        run: |
          node scripts/manualLinkHumanToAgent.js --challenge '{"name": "kanoya25", "description": "kanoya25 AI Agent"}'
