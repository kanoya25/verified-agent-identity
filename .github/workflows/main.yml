name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'Your agent name'
        required: true
        default: 'juujika'
      agent_description:
        description: 'Your agent description'
        required: true
        default: 'juujika AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # =========================
      # NODE 20 (ClawHub require)
      # =========================
      - name: Setup Node.js (ClawHub)
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install ClawHub skill
        run: npx clawhub@latest install verified-agent-identity

      # =========================
      # CLEAN INSTALL (fix ESM issues)
      # =========================
      - name: Install dependencies
        run: |
          cd scripts
          rm -rf node_modules package-lock.json
          npm install

      # =========================
      # FORCE COMPATIBILITY FIX
      # =========================
      - name: Fix crypto dependencies
        run: |
          cd scripts
          npm install @noble/hashes@latest
          npm install @iden3/js-crypto@latest
          npm install @0xpolygonid/js-sdk@latest

      # =========================
      # CREATE AGENT + HUMAN FLOW
      # =========================
      - name: Create Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js

      - name: Link Human to Agent (dynamic challenge)
        run: |
          node scripts/manualLinkHumanToAgent.js \
          --challenge "{\"name\":\"${{ github.event.inputs.agent_name }}\",\"description\":\"${{ github.event.inputs.agent_description }}\"}" | tee link_output.log

      # =========================
      # DEBUG OUTPUT (IMPORTANT)
      # =========================
      - name: Show Result
        run: |
          echo "===== LINK RESULT ====="
          cat link_output.log || true
